<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Gear Sorter smoke</title></head>
<body>
<pre id="out">running…</pre>
<script src="../color.js"></script>
<script src="../board-gate.js"></script>
<script src="../board-detect.js"></script>
<script src="../solver.js"></script>
<script>
function paintGrid(rows, cols, colors) {
  const pad = 16, cw = 28;
  const w = pad * 2 + cols * cw, h = pad * 2 + rows * cw;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1c1812';
  ctx.fillRect(0, 0, w, h);
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const rgb = colors[r][col];
      if (!rgb) continue;
      ctx.fillStyle = rgb;
      ctx.fillRect(pad + col * cw + 2, pad + r * cw + 2, cw - 4, cw - 4);
    }
  }
  return ctx.getImageData(0, 0, w, h);
}

const lines = [];
function check(name, cond, extra) {
  lines.push((cond ? 'PASS' : 'FAIL') + ' ' + name + (extra ? ' ' + extra : ''));
  return cond;
}

const R = '#dc2828', B = '#285adc', G = '#28be5a', Y = '#e6c81e';
const grid = [
  [R, R, B, B],
  [B, B, R, R],
  [G, Y, G, Y],
  [Y, G, Y, G]
];
const det = GearBoardDetect.detectBoard(paintGrid(4, 4, grid));
check('detect 4x4 ok', det.ok, det.reason || (det.rows + 'x' + det.cols));
check('detect 4x4 size', det.rows === 4 && det.cols === 4, det.rows + 'x' + det.cols);
check('detect not junk', !GearBoardGate.isJunkScan(det));

const blankC = document.createElement('canvas');
blankC.width = 80; blankC.height = 80;
const bctx = blankC.getContext('2d');
bctx.fillStyle = '#222';
bctx.fillRect(0, 0, 80, 80);
const blank = GearBoardDetect.detectBoard(bctx.getImageData(0, 0, 80, 80));
check('blank fail-closed', blank.ok === false && blank.pegs == null, blank.reason);

function paintShelves(pegsTop, pegsBot) {
  const chip = 16, gap = 64, pitch = 26;
  const w = 220, h = 340;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#765230';
  ctx.fillRect(0, 0, w, h);
  function shelf(pegs, y) {
    const x0 = Math.round((w - (pegs.length - 1) * pitch) / 2);
    pegs.forEach((stack, i) => {
      const cx = x0 + i * pitch;
      ctx.fillStyle = '#a8aab0';
      ctx.fillRect(cx - 2, y, 4, chip * 4 + 8);
      (stack || []).forEach((rgb, r) => {
        ctx.fillStyle = rgb;
        ctx.fillRect(cx - chip / 2 + 1, y + r * chip + 1, chip - 2, chip - 2);
      });
    });
  }
  shelf(pegsTop, 48);
  shelf(pegsBot, 48 + chip * 4 + gap);
  return ctx.getImageData(0, 0, w, h);
}
const RB = '#285adc', RG = '#28be5a', RY = '#e6c81e', RR = '#dc2828', RP = '#9632be';
const l32 = paintShelves(
  [[RB, RG, RB, RR], [RB, RY, RY, RB], [RG, RR, RY, RP]],
  [[RP, RG, RP, RB], [RP, RR, RR, RY], [], []]
);
const det32 = GearBoardDetect.detectBoard(l32);
check('detect L32 multi-shelf ok', det32.ok, det32.reason || (det32.rows + 'x' + det32.cols + ' chips=' + det32.chipCount));
check('detect L32 not junk', det32.ok && !GearBoardGate.isJunkScan(det32));
check('detect L32 has 5+ pegs', det32.pegs && det32.pegs.length >= 5, det32.pegs && String(det32.pegs.length));

const sample = [
  ['#e74c3c', '#e74c3c', '#3498db', '#3498db'],
  ['#3498db', '#3498db', '#e74c3c', '#e74c3c'],
  ['#2ecc71', '#f1c40f', '#2ecc71', '#f1c40f'],
  ['#f1c40f', '#2ecc71', '#f1c40f', '#2ecc71'],
  [],
  []
];
const sol = GearSolver.solve(sample, 4);
check('sample solves', sol.ok && sol.moves.length > 0, sol.reason || String(sol.moves && sol.moves.length));
const end = GearSolver.playTo(sample, sol.moves, sol.moves.length);
check('sample sorted after play', GearSolver.isSolved(end, 4));

const ok = lines.every((l) => l.startsWith('PASS'));
lines.push(ok ? 'SMOKE PASS' : 'SMOKE FAIL');
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
</html>
